<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="primary" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>
    <linearGradient id="glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0.2" />
    </linearGradient>
  </defs>
  <!-- Background with squircle safe padding -->
  <rect width="512" height="512" rx="128" fill="url(#bg)" />
  <!-- Outer subtle tech ring -->
  <circle cx="256" cy="256" r="180" fill="none" stroke="#334155" stroke-width="4" stroke-dasharray="16 12" />
  <!-- Core AI Orbit & Neural Workstation -->
  <circle cx="256" cy="256" r="120" fill="url(#glow)" />
  <circle cx="256" cy="256" r="80" fill="none" stroke="url(#primary)" stroke-width="12" />
  <!-- Central Pulse / Spark -->
  <polygon points="256,156 278,234 356,256 278,278 256,356 234,278 156,256 234,234" fill="url(#primary)" />
  <circle cx="256" cy="256" r="24" fill="#ffffff" />
  <!-- Satellites / Nodes -->
  <circle cx="160" cy="160" r="14" fill="#38bdf8" />
  <circle cx="352" cy="160" r="14" fill="#6366f1" />
  <circle cx="352" cy="352" r="14" fill="#ec4899" />
  <circle cx="160" cy="352" r="14" fill="#38bdf8" />
</svg>
